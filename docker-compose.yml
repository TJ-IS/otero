services:
  otero:
    build: .
    container_name: otero
    restart: unless-stopped
    ports:
      - "4321:3000"
    volumes:
      - ./data:/app/data
    # Inject app config (S3/R2, MinerU, OpenAI, auth, …) from .env.
    env_file:
      - .env
    # Container-specific overrides; takes precedence over env_file.
    environment:
      - NODE_ENV=production
      - OTERO_PORT=3000
      - OTERO_HOST=0.0.0.0
      # DATABASE_URL and object storage settings come from .env.
