services:
  otero:
    build: .
    container_name: otero
    restart: unless-stopped
    ports:
      - '4321:3000'
    volumes:
      - ./data:/app/data
    # Let the container reach a PostgreSQL running on the host via
    # host.docker.internal. There is no bundled database any more, so this is
    # the common local setup.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Inject app config (DATABASE_URL, S3/R2, MinerU, OpenAI, auth, …) from .env.
    env_file:
      - .env
    # Container-specific overrides; takes precedence over env_file.
    environment:
      - NODE_ENV=production
      - OTERO_PORT=3000
      - OTERO_HOST=0.0.0.0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://ais-basket.xyz}
      # DATABASE_URL comes from .env — run your own PostgreSQL 18.
      # Object storage (S3_*) comes from .env — do not hard-override here.
    networks:
      - otero-net

networks:
  otero-net:
    name: otero-net
    driver: bridge
