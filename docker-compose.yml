services:
  minio:
    image: minio/minio:latest
    container_name: otero-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      # MinIO root credentials come from .env (same values the app authenticates
      # with — see MINIO_ACCESS_KEY / MINIO_SECRET_KEY below).
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    networks:
      - otero-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: otero-postgres
    restart: unless-stopped
    ports:
      # Host access for local tooling / future app migration. Inside the
      # compose network other services reach it as hostname `postgres:5432`.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-otero}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-otero}
      - POSTGRES_DB=${POSTGRES_DB:-otero}
    networks:
      - otero-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otero} -d ${POSTGRES_DB:-otero}"]
      interval: 5s
      timeout: 5s
      retries: 10

  otero:
    build: .
    container_name: otero
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "4321:3000"
    volumes:
      - ./data:/app/data
    # Inject all app config (MinIO creds/bucket, MinerU token, OpenAI keys,
    # auth secret, editor whitelist, ...) from .env.
    env_file:
      - .env
    # Container-specific overrides that must differ from .env's host-oriented
    # values. `environment` takes precedence over `env_file`.
    environment:
      - NODE_ENV=production
      - OTERO_PORT=3000
      - OTERO_HOST=0.0.0.0
      # Reach MinIO by its compose service name on the internal network — NOT
      # the 127.0.0.1 that .env uses for host-side tooling.
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      # Same for Postgres once the app switches off SQLite.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-otero}:${POSTGRES_PASSWORD:-otero}@postgres:5432/${POSTGRES_DB:-otero}
    networks:
      - otero-net

# Dedicated bridge network for this project. Naming it explicitly (rather than
# relying on the implicit <project>_default) keeps both services on the same
# well-known network and avoids the stale-alias problem that occurs when one
# container is (re)started outside of `docker compose up`.
networks:
  otero-net:
    name: otero-net
    driver: bridge
