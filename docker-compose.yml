services:
  minio:
    image: minio/minio:latest
    container_name: otero-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      - MINIO_ROOT_USER=otero
      - MINIO_ROOT_PASSWORD=otero-secret-change-me
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  otero:
    build: .
    container_name: otero
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - OTERO_PORT=3000
      - OTERO_HOST=0.0.0.0
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=otero
      - MINIO_SECRET_KEY=otero-secret-change-me
      - MINIO_BUCKET=otero-pdfs
