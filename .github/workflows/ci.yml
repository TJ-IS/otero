name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d otero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otero_test
      # The auth test demotes a freshly promoted admin and expects another
      # admin to remain. Seeding one bootstrap editor keeps the suite
      # deterministic on a brand-new CI database.
      OTERO_EDITOR_WHITELIST: '0x0000000000000000000000000000000000000001'
      OTERO_AUTH_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Run migrations
        run: npm run migrate

      - name: Seed schema
        run: npm run seed

      - name: Run tests
        run: npm test

  # Blocking: both linters are clean, so a new warning is a regression.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      # Run both linters even when one fails, then surface the combined
      # status. Without this, a failing backend lint would skip the frontend.
      - name: Lint backend and frontend
        run: |
          status=0
          npm run lint || status=1
          npm --prefix web run lint || status=1
          exit $status

  # Blocking: the tree was normalised with prettier in a dedicated commit, so
  # any new formatting drift is a genuine failure worth stopping the merge for.
  format-check:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check
