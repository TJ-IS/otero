# Otero 生产部署 —— 自包含模板（适用于 1Panel / 宝塔等面板的编排功能）
# ============================================================================
# 用法：整份粘贴到面板的「编排模板 / Compose」编辑框，把 <...> 占位符替换成
# 真实值后部署即可。不需要额外维护 .env 文件。
#
# 重要提醒：
#  1. 数据库不在本文件内，需你自己准备好 PostgreSQL 18 并先建好库和用户；
#     连接方式由你通过下面的 DATABASE_URL 提供。
#  2. 容器启动时会自动执行 migrate + seed（建表），首次部署无需手动操作。
#  3. 本文件含明文密钥，请勿提交到公开仓库；面板里建议开启访问限制。
#  4. 若你的面板在 1Panel 里用「应用商店 → 编排」，镜像名保持完整即可。
# ============================================================================

services:
  otero:
    image: sitdownkevin/otero:latest
    container_name: otero
    restart: unless-stopped
    ports:
      # 左边是宿主机端口，按需改。若前面有 Nginx 反代，建议只监听本地：
      #   "127.0.0.1:4321:3000"
      - '4321:3000'
    volumes:
      # 运行时数据（filesystem 存储模式下的 PDF/全文、缓存等）
      - ./data:/app/data
    # 让容器能用 host.docker.internal 访问宿主机上的数据库
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # ---------- 运行环境（无需修改） ----------
      - NODE_ENV=production
      - OTERO_PORT=3000
      - OTERO_HOST=0.0.0.0

      # ---------- 站点 ----------
      # 对外访问地址，用于 canonical / sitemap / OG / llms.txt，末尾不带斜杠
      - PUBLIC_BASE_URL=https://ais-basket.xyz

      # ---------- 数据库（必填） ----------
      # 格式：postgresql://用户:密码@主机:端口/库名
      # 同机部署用 host.docker.internal；远程库直接写域名或 IP。
      # 密码含 @ : / ? # 等特殊字符必须 URL 编码（@ → %40，/ → %2F）。
      # 数据库不支持 TLS 时在末尾加 ?sslmode=disable（例如自建 PG 默认如此）。
      - DATABASE_URL=postgresql://otero:<DB_PASSWORD>@host.docker.internal:5432/otero?sslmode=disable

      # ---------- 对象存储 ----------
      # filesystem：存到容器的 /app/data/storage（已挂载到 ./data）
      # s3：Cloudflare R2 或任意 S3 兼容服务
      - STORAGE_TYPE=s3
      - S3_ENDPOINT=<ACCOUNT_ID>.r2.cloudflarestorage.com
      - S3_PORT=443
      - S3_USE_SSL=true
      - S3_ACCESS_KEY=<R2_ACCESS_KEY_ID>
      - S3_SECRET_KEY=<R2_SECRET_ACCESS_KEY>
      - S3_BUCKET=otero-pdfs
      - S3_REGION=auto
      - S3_CREATE_BUCKET=false

      # ---------- MinerU（PDF → Markdown 全文解析） ----------
      # Token 在 https://mineru.net 申请；有效期通常约 14 天，过期后需更换。
      # 留空则后台解析 worker 自动禁用，其余功能不受影响。
      - OTERO_MINERU_TOKEN=<MINERU_TOKEN>
      - OTERO_MINERU_MODEL=vlm

      # ---------- LLM（题录校准 / 字段抽取 / 条目对话） ----------
      - OPENAI_API_KEY=<OPENAI_API_KEY>
      - OPENAI_BASE_URL=https://api.deepseek.com/v1
      - OPENAI_MODEL=deepseek-v4-flash

      # ---------- 鉴权 ----------
      # 可写入的编辑者钱包地址，逗号分隔；留空则整站只读。
      - OTERO_EDITOR_WHITELIST=<EDITOR_WALLET_ADDRESS>
      # JWT 与 PDF 短链签名密钥。必须替换，用 openssl rand -hex 32 生成。
      - OTERO_AUTH_SECRET=<GENERATED_WITH_openssl_rand_hex_32>

    networks:
      - otero-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  otero-net:
    name: otero-net
    driver: bridge
